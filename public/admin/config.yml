# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: blizzjk-gif/bonatlas-site
  branch: main
  auth_methods: [token]

media_folder: public/uploads
public_folder: /uploads
app_title: BON — редакция сайта
display_url: /
logo:
  src: /images/brand/bon-master-icon.png
  show_in_header: true

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: site
    label: Страницы сайта
    icon: web
    description: Тексты, изображения и общие настройки публичных страниц.
    format: json
    media_folder: public/uploads/site
    public_folder: /uploads/site
    files:
      - name: settings
        label: Общие настройки
        icon: settings
        file: src/content/site/settings.json
        fields:
          - { label: Название бренда, name: brand, widget: string }
          - { label: Подпись домена, name: domainLabel, widget: string, hint: Можно временно указать IP-адрес }
          - { label: Краткое описание, name: tagline, widget: text }
          - { label: Подпись контактов, name: contactLabel, widget: string }
          - label: Навигация
            name: navigation
            widget: list
            fields:
              - { label: Название, name: label, widget: string }
              - { label: Ссылка, name: href, widget: string }
          - { label: Заголовок «Продукты», name: footerProductsTitle, widget: string }
          - { label: Заголовок «Материалы», name: footerMaterialsTitle, widget: string }
          - { label: Заголовок «Статус», name: footerStatusTitle, widget: string }
          - { label: Статус Atlas, name: atlasStatus, widget: string }
          - { label: Статус Plot, name: plotStatus, widget: string }
          - { label: Подпись внизу сайта, name: footerNote, widget: text }

      - name: home
        label: Главная
        icon: home
        file: src/content/site/home.json
        preview_path: /
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Заголовок вкладки, name: title, widget: string }
              - { label: Описание, name: description, widget: text }
              - { label: Изображение для соцсетей, name: image, widget: image }
          - label: Первый экран
            name: hero
            widget: object
            fields:
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Первая строка, name: title, widget: string }
              - { label: Акцентная строка, name: accent, widget: string }
              - { label: Описание, name: description, widget: text }
              - { label: Скриншот Atlas, name: atlasImage, widget: image }
              - { label: Скриншот Plot, name: plotImage, widget: image }
              - { label: Кнопка Atlas, name: atlasButton, widget: string }
              - { label: Кнопка Plot, name: plotButton, widget: string }
          - label: Карточки продуктов
            name: products
            widget: object
            fields:
              - { label: Надзаголовок секции, name: eyebrow, widget: string }
              - { label: Заголовок секции, name: title, widget: string }
              - { label: Описание секции, name: description, widget: text }
              - label: Bon Atlas
                name: atlas
                widget: object
                fields:
                  - { label: Статус, name: status, widget: string }
                  - { label: Надзаголовок, name: eyebrow, widget: string }
                  - { label: Заголовок, name: title, widget: text }
                  - { label: Подпись ссылки, name: action, widget: string }
                  - { label: Логотип, name: logo, widget: image }
                  - { label: Изображение, name: image, widget: image }
              - label: Bon Plot
                name: plot
                widget: object
                fields:
                  - { label: Статус, name: status, widget: string }
                  - { label: Надзаголовок, name: eyebrow, widget: string }
                  - { label: Заголовок, name: title, widget: text }
                  - { label: Подпись ссылки, name: action, widget: string }
                  - { label: Логотип, name: logo, widget: image }
                  - { label: Изображение, name: image, widget: image }
          - label: Связь продуктов
            name: connection
            widget: object
            fields:
              - { label: Маркер, name: kicker, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Описание, name: description, widget: text }
              - label: Строки
                name: items
                widget: list
                fields:
                  - { label: Метка, name: label, widget: string }
                  - { label: Текст, name: title, widget: string }
                  - { label: Продукт, name: product, widget: string }
          - label: Рабочие экраны
            name: proof
            widget: object
            fields:
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Описание, name: description, widget: text }
              - label: Экраны
                name: items
                widget: list
                fields:
                  - { label: Изображение, name: image, widget: image }
                  - { label: Описание изображения, name: alt, widget: string }
                  - { label: Подпись, name: caption, widget: string }
          - label: Принципы
            name: principles
            widget: object
            fields:
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - label: Пункты
                name: items
                widget: list
                fields:
                  - { label: Номер, name: number, widget: string }
                  - { label: Заголовок, name: title, widget: string }
                  - { label: Описание, name: description, widget: text }
          - label: Финальный призыв
            name: closing
            widget: object
            fields:
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Кнопка Atlas, name: atlasButton, widget: string }
              - { label: Кнопка Plot, name: plotButton, widget: string }

      - name: atlas
        label: Bon Atlas
        icon: map
        file: src/content/site/atlas.json
        preview_path: /atlas
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Заголовок вкладки, name: title, widget: string }
              - { label: Описание, name: description, widget: text }
              - { label: Изображение для соцсетей, name: image, widget: image }
          - label: Первый экран
            name: hero
            widget: object
            fields:
              - { label: Логотип, name: logo, widget: image }
              - { label: Статус, name: status, widget: string }
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Первая строка, name: title, widget: string }
              - { label: Акцентная строка, name: accent, widget: string }
              - { label: Описание, name: description, widget: text }
              - { label: Основная кнопка, name: primaryButton, widget: string }
              - { label: Вторая кнопка, name: secondaryButton, widget: string }
              - { label: Служебная строка, name: meta, widget: string }
              - { label: Главный скриншот, name: image, widget: image }
              - { label: Описание скриншота, name: imageAlt, widget: string }
              - { label: Фоновая карта, name: backgroundImage, widget: image }
          - label: Генерация
            name: generator
            widget: object
            fields: &feature_fields
              - { label: Маркер, name: kicker, widget: string }
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Описание, name: description, widget: text }
              - label: Пункты
                name: bullets
                widget: list
                field: { label: Пункт, name: item, widget: string }
              - { label: Изображение, name: image, widget: image }
              - { label: Описание изображения, name: imageAlt, widget: string }
              - { label: Подпись, name: caption, widget: string }
          - label: Редактор объектов
            name: editing
            widget: object
            fields: *feature_fields
          - label: Библиотека ассетов
            name: assets
            widget: object
            fields:
              - { label: Маркер, name: kicker, widget: string }
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Описание, name: description, widget: text }
              - { label: Изображение, name: image, widget: image }
              - { label: Описание изображения, name: imageAlt, widget: string }
              - { label: Подпись, name: caption, widget: string }
              - label: Пояснения
                name: notes
                widget: list
                fields:
                  - { label: Номер, name: number, widget: string }
                  - { label: Заголовок, name: title, widget: string }
                  - { label: Описание, name: description, widget: text }
          - label: Оформление
            name: styling
            widget: object
            fields:
              - { label: Маркер, name: kicker, widget: string }
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Описание, name: description, widget: text }
              - { label: Изображение, name: image, widget: image }
              - { label: Описание изображения, name: imageAlt, widget: string }
              - { label: Подпись, name: caption, widget: string }
          - label: Локальная библиотека
            name: library
            widget: object
            fields:
              - { label: Маркер, name: kicker, widget: string }
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Описание, name: description, widget: text }
              - { label: Изображение, name: image, widget: image }
              - { label: Описание изображения, name: imageAlt, widget: string }
          - label: Результат
            name: result
            widget: object
            fields:
              - { label: Маркер, name: kicker, widget: string }
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Описание, name: description, widget: text }
              - { label: Изображение, name: image, widget: image }
              - { label: Описание изображения, name: imageAlt, widget: string }
          - label: Финальный призыв
            name: cta
            widget: object
            fields:
              - { label: Надзаголовок, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Кнопка, name: button, widget: string }

      - name: plot
        label: Bon Plot
        icon: auto_stories
        file: src/content/site/plot.json
        preview_path: /plot
        fields:
          - label: "SEO"
            name: seo
            widget: object
            fields:
              - label: "Заголовок"
                name: title
                widget: string
              - label: "Описание"
                name: description
                widget: text
              - label: "Изображение"
                name: image
                widget: image
          - label: "Первый экран"
            name: hero
            widget: object
            fields:
              - label: "Логотип"
                name: logo
                widget: image
              - label: "Статус"
                name: status
                widget: string
              - label: "Надзаголовок"
                name: eyebrow
                widget: string
              - label: "Заголовок"
                name: title
                widget: string
              - label: "Описание"
                name: description
                widget: text
              - label: "Основная кнопка"
                name: primaryButton
                widget: string
              - label: "Вторая ссылка"
                name: secondaryButton
                widget: string
              - label: "Служебная строка"
                name: meta
                widget: string
              - label: "Изображение"
                name: image
                widget: image
              - label: "Описание изображения"
                name: imageAlt
                widget: string
          - label: "Проблема автора"
            name: problem
            widget: object
            fields:
              - label: "Надзаголовок"
                name: eyebrow
                widget: string
              - label: "Заголовок"
                name: title
                widget: string
              - label: "Описание"
                name: description
                widget: text
              - label: "Тезисы"
                name: points
                widget: list
                min: 1
                field: { label: Тезис, name: value, widget: string }
          - label: "Матрица сюжета"
            name: story
            widget: object
            fields:
              - label: "Надзаголовок"
                name: eyebrow
                widget: string
              - label: "Заголовок"
                name: title
                widget: string
              - label: "Описание"
                name: description
                widget: text
              - label: "Изображение"
                name: image
                widget: image
              - label: "Описание изображения"
                name: imageAlt
                widget: string
          - label: "Рукопись"
            name: manuscript
            widget: object
            fields:
              - label: "Надзаголовок"
                name: eyebrow
                widget: string
              - label: "Заголовок"
                name: title
                widget: string
              - label: "Описание"
                name: description
                widget: text
              - label: "Вкладки"
                name: tabs
                widget: list
                min: 1
                fields:
                  - label: "Название вкладки"
                    name: label
                    widget: string
                  - label: "Изображение"
                    name: image
                    widget: image
                  - label: "Описание изображения"
                    name: alt
                    widget: string
          - label: "Персонажи и мир"
            name: world
            widget: object
            fields:
              - label: "Надзаголовок"
                name: eyebrow
                widget: string
              - label: "Заголовок"
                name: title
                widget: string
              - label: "Описание"
                name: description
                widget: text
              - label: "Вкладки"
                name: tabs
                widget: list
                min: 1
                fields:
                  - label: "Название вкладки"
                    name: label
                    widget: string
                  - label: "Изображение"
                    name: image
                    widget: image
                  - label: "Описание изображения"
                    name: alt
                    widget: string
          - label: "Проверка и импорт"
            name: checks
            widget: object
            fields:
              - label: "Надзаголовок"
                name: eyebrow
                widget: string
              - label: "Заголовок"
                name: title
                widget: string
              - label: "Описание"
                name: description
                widget: text
              - label: "Тезисы"
                name: points
                widget: list
                min: 1
                fields:
                  - label: "Заголовок"
                    name: title
                    widget: string
                  - label: "Описание"
                    name: description
                    widget: text
              - label: "Вкладки"
                name: tabs
                widget: list
                min: 1
                fields:
                  - label: "Название вкладки"
                    name: label
                    widget: string
                  - label: "Изображение"
                    name: image
                    widget: image
                  - label: "Описание изображения"
                    name: alt
                    widget: string
          - label: "Финальный блок"
            name: cta
            widget: object
            fields:
              - label: "Надзаголовок"
                name: eyebrow
                widget: string
              - label: "Заголовок"
                name: title
                widget: string
              - label: "Описание"
                name: description
                widget: text
              - label: "Статус"
                name: status
                widget: string
              - label: "Пояснение"
                name: note
                widget: text
              - label: "Кнопка"
                name: button
                widget: string
              - label: "Служебная строка"
                name: meta
                widget: string
          - label: "Вопросы и ответы"
            name: faq
            widget: object
            fields:
              - label: "Надзаголовок"
                name: eyebrow
                widget: string
              - label: "Заголовок"
                name: title
                widget: string
              - label: "Вопросы"
                name: items
                widget: list
                min: 1
                fields:
                  - label: "Вопрос"
                    name: question
                    widget: string
                  - label: "Ответ"
                    name: answer
                    widget: text

  - divider: true

  - name: blog
    label: Блог
    label_singular: Статья
    icon: article
    folder: src/content/blog
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{publishedAt}}"
    sortable_fields: [publishedAt, title, category]
    view_filters:
      - label: Черновики
        field: draft
        pattern: true
    fields:
      - { label: Заголовок, name: title, widget: string }
      - { label: Описание, name: description, widget: text }
      - { label: URL, name: slug, widget: string, hint: "Латиницей, например: first-map" }
      - label: Рубрика
        name: category
        widget: select
        options: [Карты, Писательская работа, Персонажи, Сюжет, Создание миров]
      - { label: Автор, name: author, widget: string, default: "Команда Bon Atlas" }
      - { label: Дата публикации, name: publishedAt, widget: datetime, date_format: "DD.MM.YYYY", time_format: false }
      - { label: Дата обновления, name: updatedAt, widget: datetime, date_format: "DD.MM.YYYY", time_format: false, required: false }
      - { label: Черновик, name: draft, widget: boolean, default: true }
      - { label: Демонстрационный материал, name: demo, widget: boolean, default: false, hint: "Только для тестовых заглушек, не для редакционных статей." }
      - { label: Обложка, name: image, widget: image, required: false }
      - { label: Описание обложки, name: imageAlt, widget: string, required: false }
      - { label: Связанные статьи, name: related, widget: list, required: false }
      - { label: Показывать блок инструментов, name: showSolutions, widget: boolean, default: true, hint: "Две карточки продуктов после основного текста статьи." }
      - label: Контекст блока инструментов
        name: solutionsContext
        widget: select
        default: auto
        hint: "Меняет тексты карточек. В режиме Автоматически контекст определяется рубрикой; в статьях о картах Bon Atlas показывается первым."
        options:
          - { label: Автоматически по рубрике, value: auto }
          - { label: Писательская работа, value: writing }
          - { label: Карты, value: maps }
          - { label: Создание миров, value: worldbuilding }
      - { label: Текст, name: body, widget: markdown }
