name: Validate received Bon Plot public facts

on:
  push:
    paths: ['public/product-info/**', 'scripts/sync-bon-plot.mjs', 'tests/product-sync.test.mjs', '.github/workflows/sync-bon-plot.yml']
  pull_request:
    paths: ['public/product-info/**', 'scripts/sync-bon-plot.mjs', 'tests/product-sync.test.mjs', '.github/workflows/sync-bon-plot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: node --test tests/product-sync.test.mjs
      - run: node scripts/sync-bon-plot.mjs --verify-public
